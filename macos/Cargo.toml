[package]
name = "touchpadflow-macos"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
description = "Native macOS trackpad edge gesture daemon in Rust"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
lto = "thin"
opt-level = 3
strip = true
