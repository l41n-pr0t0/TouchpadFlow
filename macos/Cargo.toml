[package]
name = "touchpadflow-macos"
version = "0.4.0"
edition = "2024"
license = "Apache-2.0"
description = "Native macOS trackpad edge gesture daemon in Rust"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
libc = "0.2"

[profile.release]
lto = "thin"
opt-level = 3
strip = true
