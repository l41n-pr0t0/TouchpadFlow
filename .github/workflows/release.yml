name: Release

# Push a tag like v0.2.0 to build every platform and publish the downloads
# that install.sh / install.ps1 fetch from releases/latest.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  linux:
    name: Linux ${{ matrix.arch }}
    strategy:
      matrix:
        include:
          # 22.04 = glibc 2.35, so the binaries also run on older distros.
          - { runner: ubuntu-22.04, arch: x86_64 }
          - { runner: ubuntu-22.04-arm, arch: aarch64 }
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo build --release --bins
      - name: Package
        run: |
          mkdir -p dist/touchpadflow
          cp target/release/touchpadflow target/release/touchpadflow-app \
             udev/70-touchpadflow.rules systemd/touchpadflow.service \
             linux/touchpadflow.desktop dist/touchpadflow/
          tar -C dist -czf touchpadflow-linux-${{ matrix.arch }}.tar.gz touchpadflow
      - uses: actions/upload-artifact@v4
        with:
          name: linux-${{ matrix.arch }}
          path: touchpadflow-linux-${{ matrix.arch }}.tar.gz

  macos:
    name: macOS universal
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin
      - name: Build both architectures
        run: |
          for t in aarch64-apple-darwin x86_64-apple-darwin; do
            cargo build --release --bin touchpadflow-app --target $t
            cargo build --release --manifest-path macos/Cargo.toml --target $t
          done
      - name: Package universal binaries
        run: |
          mkdir -p dist/touchpadflow
          lipo -create -output dist/touchpadflow/touchpadflow-app \
            target/{aarch64,x86_64}-apple-darwin/release/touchpadflow-app
          lipo -create -output dist/touchpadflow/touchpadflow-macos \
            macos/target/{aarch64,x86_64}-apple-darwin/release/touchpadflow-macos
          codesign --force -s - dist/touchpadflow/*
          tar -C dist -czf touchpadflow-macos-universal.tar.gz touchpadflow
      - name: Build TouchpadFlow.dmg
        run: |
          # Drag-to-Applications bundle: settings app + engine; the app registers the engine at login.
          VERSION="${GITHUB_REF_NAME#v}"
          APP=dmg/TouchpadFlow.app
          mkdir -p "$APP/Contents/MacOS"
          cp dist/touchpadflow/touchpadflow-app dist/touchpadflow/touchpadflow-macos "$APP/Contents/MacOS/"
          cat > "$APP/Contents/Info.plist" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>CFBundleName</key><string>TouchpadFlow</string>
            <key>CFBundleIdentifier</key><string>com.touchpadflow.app</string>
            <key>CFBundleExecutable</key><string>touchpadflow-app</string>
            <key>CFBundlePackageType</key><string>APPL</string>
            <key>CFBundleShortVersionString</key><string>$VERSION</string>
            <key>CFBundleVersion</key><string>$VERSION</string>
            <key>LSMinimumSystemVersion</key><string>11.0</string>
            <key>NSHighResolutionCapable</key><true/>
          </dict></plist>
          EOF
          codesign --force --deep -s - "$APP"
          ln -s /Applications dmg/Applications
          hdiutil create -volname TouchpadFlow -srcfolder dmg -ov -format UDZO TouchpadFlow-macos-universal.dmg
      - uses: actions/upload-artifact@v4
        with:
          name: macos
          path: |
            touchpadflow-macos-universal.tar.gz
            TouchpadFlow-macos-universal.dmg

  windows:
    name: Windows ${{ matrix.arch }}
    strategy:
      matrix:
        include:
          - { runner: windows-latest, arch: x64 }
          - { runner: windows-11-arm, arch: arm64 }
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"
      - uses: dtolnay/rust-toolchain@stable
      - name: Build engine and app
        run: |
          dotnet publish windows/TouchpadFlow.csproj -c Release -r win-${{ matrix.arch }} --self-contained -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -o out
          cargo build --release --bin touchpadflow-app
      - name: Package
        shell: pwsh
        run: |
          New-Item dist -ItemType Directory | Out-Null
          Copy-Item out/TouchpadFlow.exe, target/release/touchpadflow-app.exe dist/
          Compress-Archive dist/* touchpadflow-windows-${{ matrix.arch }}.zip
      - uses: actions/upload-artifact@v4
        with:
          name: windows-${{ matrix.arch }}
          path: touchpadflow-windows-${{ matrix.arch }}.zip

  windows-installer:
    name: Windows setup .exe
    needs: windows
    # Inno Setup only packages files, so one x64 runner builds both architectures.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: windows-*
          merge-multiple: true
      - name: Build installers
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress | Out-Null }
          $version = $env:GITHUB_REF_NAME.TrimStart('v')
          foreach ($arch in 'x64', 'arm64') {
            Expand-Archive "touchpadflow-windows-$arch.zip" -DestinationPath "src-$arch"
            & $iscc "/DArch=$arch" "/DAppVersion=$version" "/DSrcDir=$PWD\src-$arch" "/O$PWD" windows\installer.iss
            if ($LASTEXITCODE) { exit $LASTEXITCODE }
          }
      - uses: actions/upload-artifact@v4
        with:
          name: windows-installer
          path: TouchpadFlow-Setup-*.exe

  publish:
    needs: [linux, macos, windows, windows-installer]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            touchpadflow-linux-*.tar.gz
            touchpadflow-macos-universal.tar.gz
            TouchpadFlow-macos-universal.dmg
            touchpadflow-windows-*.zip
            TouchpadFlow-Setup-*.exe
