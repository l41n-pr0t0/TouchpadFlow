[package]
name = "touchpadflow"
version = "0.4.0"
edition = "2024"
rust-version = "1.95"
description = "Multi-finger touchpad gesture daemon for Linux and KDE Plasma 6 with two-finger edge volume and brightness sliders"
license = "Apache-2.0"
repository = "https://github.com/l41n-pr0t0/TouchpadFlow"
readme = "README.md"
keywords = ["touchpad", "gestures", "kde", "wayland", "evdev"]
categories = ["command-line-utilities", "os::linux-apis"]

[dependencies]
clap = { version = "4.5", features = ["derive"] }
eframe = { version = "0.37", features = ["glow"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"

[target.'cfg(target_os = "linux")'.dependencies]
evdev = "0.13"
signal-hook = "0.3"

[[bin]]
name = "touchpadflow"
path = "src/main.rs"

[[bin]]
name = "touchpadflow-app"
path = "src/bin/touchpadflow-app.rs"

[dev-dependencies]

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
cast_precision_loss = "allow"
cast_possible_truncation = "allow"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
